# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # CODE IS NOT THE ONLY THING THAT CHANGES.
  #
  # --from-cms bakes the published CMS record into the HTML at BUILD time.
  # Publishing in /admin writes the CMS row and touches nothing here, so with
  # `push` as the only trigger the served HTML stays frozen at whatever the
  # row held when the last commit landed -- while the browser paints the
  # current row over it after load. That is the DevTools/View-Source split:
  # the page looks right and its source is stale. A publish therefore has to
  # be able to start a build.
  #
  # repository_dispatch is the immediate path. Anything server-side that
  # knows a publish happened -- a Supabase Database Webhook on the brand
  # table is the intended one -- POSTs to
  #   /repos/<owner>/<repo>/dispatches   {"event_type":"cms-published"}
  # with a token of its own, and the site rebuilds within the minute. No
  # credential lives in this repository and no browser code is involved.
  # Until that is configured this trigger is simply never fired.
  repository_dispatch:
    types: [cms-published]

  # The safety net, and what makes publishing reach the HTML with nothing
  # configured at all: rebuild on a timer. The build is deterministic -- same
  # row, same bytes -- so a run with nothing to do republishes what is
  # already there, and one that cannot read the row fails without deploying.
  schedule:
    - cron: "*/30 * * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # The production HTML is ASSEMBLED, not served from the repository.
      # build-site.js renders this brand's pages from templates/ + brands/,
      # bakes the published Page Builder sections into their mounts with the
      # same renderer the browser runs, verifies the committed build source
      # against the provenance recorded when it was exported, generates
      # sitemap.xml and robots.txt through the same generator this step used
      # to call directly, and then checks its own output -- an exact file set,
      # this brand's js/brand.js, no unresolved token or slot marker, and a
      # sitemap naming this domain. Anything wrong fails the deploy instead of
      # publishing an unverified site, which is also why the old prune step is
      # gone: the assembler emits only site files, so there is nothing to
      # remove.
      # --from-cms reads THIS brand's published CMS record and bakes what it
      # finds, so a content change reaches the HTML without anyone editing
      # brands/<id>/brand.js. It refuses rather than emptying pages: an
      # unreachable row, a row for the wrong brand, or a row that publishes
      # nothing where the committed layer publishes something all stop the
      # deploy with a message naming the brand and the reason.
      - name: Assemble the site
        run: node tools/build-site.js jsk-1.com --from-cms --out _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the assembled site, not the repository
          path: '_site/jsk-1.com'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # PROVE IT, rather than trusting that the steps above add up.
      #
      # Every step here can report success while the acceptance criterion
      # fails: the build can bake, the upload can succeed, the deployment can
      # say "Reported success!", and the HTML the site returns can still be
      # the previous version -- which a browser hides, because the runtime
      # paints the live row over the mount after load. So the URL that was
      # just deployed to is fetched, and the baked markup THIS run produced
      # has to be in the response body, verbatim, with no JavaScript
      # involved. A mismatch fails the deploy loudly instead of leaving a
      # page whose source and DOM disagree.
      #
      # It learns the pages and the expected bytes from the artifact that was
      # just built and the URL that was just deployed to, so it names no
      # brand and no domain of its own.
      - name: Verify the baked CMS content is in the deployed HTML
        run: |
          node tools/verify-deployed.js \
            --site _site/jsk-1.com \
            --url "${{ steps.deployment.outputs.page_url }}"
