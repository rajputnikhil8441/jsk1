# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # The production HTML is ASSEMBLED, not served from the repository.
      # build-site.js renders this brand's pages from templates/ + brands/,
      # bakes the published Page Builder sections into their mounts with the
      # same renderer the browser runs, verifies the committed build source
      # against the provenance recorded when it was exported, generates
      # sitemap.xml and robots.txt through the same generator this step used
      # to call directly, and then checks its own output -- an exact file set,
      # this brand's js/brand.js, no unresolved token or slot marker, and a
      # sitemap naming this domain. Anything wrong fails the deploy instead of
      # publishing an unverified site, which is also why the old prune step is
      # gone: the assembler emits only site files, so there is nothing to
      # remove.
      # --from-cms reads THIS brand's published CMS record and bakes what it
      # finds, so a content change reaches the HTML without anyone editing
      # brands/<id>/brand.js. It refuses rather than emptying pages: an
      # unreachable row, a row for the wrong brand, or a row that publishes
      # nothing where the committed layer publishes something all stop the
      # deploy with a message naming the brand and the reason.
      - name: Assemble the site
        run: node tools/build-site.js jsk-1.com --from-cms --out _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the assembled site, not the repository
          path: '_site/jsk-1.com'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
