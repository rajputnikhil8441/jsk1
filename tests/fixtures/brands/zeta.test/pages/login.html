<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sign in — {{brand.name}}</title>
    <meta name="description" content="Sign in at {{brand.domain}}." />
    <script src="js/cms-config.js"></script>
    <script src="js/brand.js"></script>
    <script src="js/cms.js"></script>
</head>
<body>
    <main class="zeta-signin">
        <h1 data-cms-text="branding.siteName">{{brand.name}}</h1>
        <p class="zeta-blurb">A completely different login arrangement for {{brand.name}}.</p>
        <form class="zeta-form">
            <input type="tel" placeholder="Mobile number" />
            <button type="submit">Continue</button>
        </form>
        <!-- BRAND:login-notice --><!-- /BRAND:login-notice -->
    </main>
</body>
</html>
